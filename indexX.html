const RECIPIENT="34664301551";
let activeLanguage="pt";
const ids=["interest","budget","horizon"];
function translate(key,index,subindex){
 const o=TXT[activeLanguage][key],v=o[index];
 return subindex===undefined?v:v[subindex];
}
function put(el,value){el.textContent=value;}
function opt(value,label,selected=false){
 const e=document.createElement("option");e.value=value;e.textContent=label;e.selected=selected;return e;
}
function renderCards(){
 const root=document.getElementById("opportunity-cards");
 root.replaceChildren();
 TXT[activeLanguage].cards.forEach((item,i)=>{
  const card=document.createElement("article");card.className="opportunity reveal in";
  card.innerHTML=`<div class="op-head"><span class="number">0${i+1}</span><span class="concept">${item[0]}</span></div><div><h3>${item[1]}</h3><p>${item[2]}</p></div><div class="op-meta"><small>${item[3]}</small><button class="round" type="button" aria-label="${TXT[activeLanguage].opp[3]}: ${item[1]}">↗</button></div>`;
  card.querySelector("button").addEventListener("click",()=>{
   document.getElementById("interest").value="o"+i;
   document.getElementById("contact").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
   document.getElementById("interest").focus({preventScroll:true});
  });
  root.append(card);
 });
}
function renderRepeats(){
 const t=TXT[activeLanguage];
 const models=document.getElementById("models-grid");
 models.replaceChildren();
 t.models.forEach((m,i)=>{
  const el=document.createElement("div");el.className="model reveal in";
  const ico=document.createElement("div");ico.className="icon";ico.textContent=["↗","⌁","◈","⊕"][i];
  const h=document.createElement("h3");h.textContent=m[0];const p=document.createElement("p");p.textContent=m[1];el.append(ico,h,p);models.append(el);
 });
 const checks=document.getElementById("checks-grid");checks.replaceChildren();
 t.checks.forEach((m,i)=>{
  const el=document.createElement("div");el.className="check reveal in";
  const title=document.createElement("b");title.textContent=`0${i+1} · ${m[0]}`;const p=document.createElement("p");p.textContent=m[1];el.append(title,p);checks.append(el);
 });
 const steps=document.getElementById("steps-grid");steps.replaceChildren();
 t.steps.forEach(m=>{
  const el=document.createElement("article");el.className="step reveal in";
  const nr=document.createElement("i");nr.textContent=m[0];const h=document.createElement("h3");h.textContent=m[1];const p=document.createElement("p");p.textContent=m[2];el.append(nr,h,p);steps.append(el);
 });
}
function renderSelects(){
 const t=TXT[activeLanguage],s=document.getElementById("interest"),b=document.getElementById("budget"),h=document.getElementById("horizon");
 const keep=[s.value,b.value,h.value];
 s.replaceChildren(opt("",t.form[12]));
 t.cards.forEach((item,i)=>s.append(opt("o"+i,item[1])));
 s.append(opt("other",t.form[14]),opt("exploring",t.form[15]));
 b.replaceChildren(...t.budget.map((v,i)=>opt("b"+i,v)));
 h.replaceChildren(...t.horizons.map((v,i)=>opt("h"+i,v)));
 if([...s.options].some(x=>x.value===keep[0]))s.value=keep[0];
 if([...b.options].some(x=>x.value===keep[1]))b.value=keep[1];
 if([...h.options].some(x=>x.value===keep[2]))h.value=keep[2];
}
function setLanguage(language){
 if(!TXT[language])return;
 activeLanguage=language;
 document.documentElement.lang=language==="pt"?"pt-BR":language;
 document.title="Grupo Pipa — "+({pt:"Oportunidades Privadas",es:"Oportunidades Privadas",en:"Private Opportunities"}[language]);
 document.querySelectorAll("[data-key]").forEach(el=>{
  const sub=el.dataset.subindex;
  const value=translate(el.dataset.key,Number(el.dataset.index),sub===undefined?undefined:Number(sub));
  if(typeof value==="string")el.textContent=value;
 });
 document.querySelectorAll(".locale button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===language)));
 document.getElementById("header-private").textContent=TXT[language].hero[0];
 document.querySelector(".locale").setAttribute("aria-label",{pt:"Selecionar idioma",es:"Seleccionar idioma",en:"Select language"}[language]);
 document.getElementById("hero-title").innerHTML=TXT[language].hero[1].replace(" de Pipa "," <em>de Pipa</em> ").replace(" of Pipa "," <em>of Pipa</em> ");
 document.getElementById("person").placeholder=TXT[language].form[8];
 document.getElementById("note").placeholder=TXT[language].form[9];
 document.getElementById("form-error").textContent="";
 renderCards();renderRepeats();renderSelects();
 try{localStorage.setItem("gp.investments.lang",language)}catch{}
}
document.querySelectorAll(".locale button").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));
document.getElementById("invest-form").addEventListener("submit",event=>{
 event.preventDefault();
 const t=TXT[activeLanguage],f=t.form;
 const interest=document.getElementById("interest").value;
 if(!interest){document.getElementById("form-error").textContent=f[12];document.getElementById("interest").focus();return;}
 const index=interest.startsWith("o")?Number(interest.slice(1)):-1;
 const opportunity=index>=0?t.cards[index][1]:interest==="other"?f[14]:f[15];
 const b=document.getElementById("budget").value, h=document.getElementById("horizon").value;
 const budget=t.budget[Number(b.slice(1))]||t.budget[0],horizon=t.horizons[Number(h.slice(1))]||t.horizons[0];
 const name=document.getElementById("person").value.trim(), note=document.getElementById("note").value.trim();
 const m=t.whats;
 const lines=[m[0],"",`${m[1]}: ${opportunity}`,`${m[2]}: ${budget}`,`${m[3]}: ${horizon}`];
 if(name)lines.push(`${m[4]}: ${name}`);
 if(note)lines.push(`${m[5]}: ${note}`);
 lines.push("",m[6]);
 const url=`https://wa.me/${RECIPIENT}?text=${encodeURIComponent(lines.join("\n"))}`;
 const anchor=document.createElement("a");anchor.href=url;anchor.target="_blank";anchor.rel="noopener noreferrer";
 document.body.append(anchor);anchor.click();anchor.remove();
});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce||!window.IntersectionObserver)document.querySelectorAll(".reveal").forEach(x=>x.classList.add("in"));
else{const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll(".reveal").forEach(x=>io.observe(x));}
let start="pt";try{start=localStorage.getItem("gp.investments.lang")||"pt"}catch{}
setLanguage(start);
</script>
